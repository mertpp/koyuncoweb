# CI: task check (typecheck + lint + build) on every push. Same rules as the backend repo:
# actions pinned by full commit SHA with the version in a comment; Dependabot
# (.github/dependabot.yml) proposes the upgrades.

name: ci

on:
  # Every branch: the commit must be green BEFORE the fast-forward into master.
  push:
    branches: ["**"]
    # Skipped only if EVERY file of the push is here: task check checks none of it.
    paths-ignore:
      - "doc/**"
      - "**/*.md"
      - ".devcontainer/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repository.
permissions:
  contents: read

jobs:
  check:
    name: task check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The build loads the auth config, which requires these variables. Fake values: CI never
    # signs anyone in nor calls the API. Real values live only in the local .env (never committed).
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXTAUTH_SECRET: ci-placeholder
      AZURE_ENTRA_CLIENT_ID: ci-placeholder
      AZURE_ENTRA_CLIENT_SECRET: ci-placeholder
      AZURE_ENTRA_API_SCOPE: api://ci-placeholder/access
      API_BASE_URL: http://localhost:8004
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Same Node major as .devcontainer/devcontainer.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - run: pnpm install --frozen-lockfile
      - run: task check
